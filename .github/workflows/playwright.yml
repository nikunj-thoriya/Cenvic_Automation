name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Runs daily at 3:30 AM UTC (9:00 AM IST / 10:30 AM CEST)
    - cron: '30 3 * * *'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  smoke-tests:
    name: Smoke Tests (@High)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies only
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Create .env.dev
        run: |
          cat <<'EOF' > .env.dev
          TEST_ENV=dev
          BASE_URL=${{ secrets.DEV_BASE_URL }}
          LOGIN_PATH=/login
          API_BASE_URL=${{ secrets.DEV_API_BASE_URL }}
          SWAGGER_URL=https://cenvicapidev.alliancetek.net/swagger/index.html
          SWAGGER_JSON_URL=https://cenvicapidev.alliancetek.net/swagger/v1/swagger.json
          HEADLESS=true
          RETRIES=1
          WORKERS=1
          TEST_TIMEOUT=63000
          EXPECT_TIMEOUT=13000
          ACTION_TIMEOUT=18000
          NAVIGATION_TIMEOUT=33000
          USER_USERNAME=${{ secrets.DEV_USER_USERNAME }}
          USER_PASSWORD=${{ secrets.DEV_USER_PASSWORD }}
          NO_CAMPAIGN_USER_USERNAME=nik@yopmail.com
          NO_CAMPAIGN_USER_PASSWORD=bq6Qk&lHbnT^
          YOPMAIL_URL=https://yopmail.com
          EOF

      - name: Run smoke tests (@High)
        run: npx playwright test tests/login --grep @High

      - name: Show test summary
        if: always()
        run: node utils/ci-summary.mjs "Smoke tests (@High)"

      - name: Upload test results on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-tests-results
          path: |
            test-results/
            reports/
            playwright-report/
          retention-days: 30

  full-tests:
    name: Full Suite - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # Browsers are pre-installed in this image, so no install step is needed.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    needs: lint-and-typecheck
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Comment out a line below to skip that browser (keep at least one).
        browser:
          - chromium
        #  - firefox
        #  - webkit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.dev
        run: |
          cat <<'EOF' > .env.dev
          TEST_ENV=dev
          BASE_URL=${{ secrets.DEV_BASE_URL }}
          LOGIN_PATH=/login
          API_BASE_URL=${{ secrets.DEV_API_BASE_URL }}
          SWAGGER_URL=https://cenvicapidev.alliancetek.net/swagger/index.html
          SWAGGER_JSON_URL=https://cenvicapidev.alliancetek.net/swagger/v1/swagger.json
          HEADLESS=true
          RETRIES=1
          WORKERS=1
          TEST_TIMEOUT=63000
          EXPECT_TIMEOUT=13000
          ACTION_TIMEOUT=18000
          NAVIGATION_TIMEOUT=33000
          USER_USERNAME=${{ secrets.DEV_USER_USERNAME }}
          USER_PASSWORD=${{ secrets.DEV_USER_PASSWORD }}
          NO_CAMPAIGN_USER_USERNAME=nik@yopmail.com
          NO_CAMPAIGN_USER_PASSWORD=bq6Qk&lHbnT^
          YOPMAIL_URL=https://yopmail.com
          EOF

      - name: Run login tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright test tests/login

      - name: Show test summary
        if: always()
        run: node utils/ci-summary.mjs "Full suite (${{ matrix.browser }})"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            test-results/
            reports/
            playwright-report/
          retention-days: 30

  publish-report:
    name: Publish Report to Pages
    runs-on: ubuntu-latest
    needs: [full-tests]
    # Same-repo runs only: fork PRs get a read-only token and cannot push to gh-pages.
    if: ${{ always() && needs.full-tests.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: write
    concurrency:
      group: publish-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download full-suite report
        uses: actions/download-artifact@v4
        with:
          name: test-results-chromium
          path: artifacts/test-results-chromium

      - name: Publish report to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RESULT: ${{ needs.full-tests.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          slug() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//' | cut -c1-40 | sed 's/-$//'; }

          latest=$(find artifacts/test-results-chromium/reports -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          if [ -z "$latest" ]; then echo "No Playwright report found in artifact"; exit 1; fi

          if [ "$EVENT" = "pull_request" ]; then
            title_slug=$(slug "$PR_TITLE")
            dir="pull-requests/$(slug "$PR_AUTHOR")/pr-${PR_NUMBER}${title_slug:+-$title_slug}"
            kind="PR #${PR_NUMBER}"; author="$PR_AUTHOR"; title="$PR_TITLE"
          else
            dir="$(slug "$REF_NAME")"
            kind="$EVENT"; author="$ACTOR"; title="$EVENT on $REF_NAME"
          fi
          run="$dir/run-${RUN_NUMBER}"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone -q --depth 1 --branch gh-pages "$remote" site
          else
            git init -q -b gh-pages site
            git -C site remote add origin "$remote"
          fi

          root="$PWD"
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll

          mkdir -p "$run" "$dir/latest"
          cp -r "$root/$latest"/. "$run"/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=../run-%s/">\n' "$RUN_NUMBER" > "$dir/latest/index.html"

          jq -n \
            --arg title "$title" --arg author "$author" --arg kind "$kind" \
            --arg ref "$REF_NAME" --arg sha "$SHA" --arg result "$RESULT" \
            --arg run_number "$RUN_NUMBER" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_url "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            '{title:$title, author:$author, kind:$kind, ref:$ref, sha:$sha, result:$result, run_number:$run_number, date:$date, run_url:$run_url}' \
            > "$run/meta.json"

          node "$GITHUB_WORKSPACE/utils/build-reports-index.mjs" .

          git add -A
          git commit -q -m "report: $run ($RESULT)"
          git push -q origin gh-pages

          owner="${REPO%%/*}"; name="${REPO##*/}"
          {
            echo "### Playwright report published"
            echo "- Run report: https://${owner}.github.io/${name}/${run}/"
            echo "- Latest for this ${kind}: https://${owner}.github.io/${name}/${dir}/latest/"
            echo "- All reports: https://${owner}.github.io/${name}/"
          } >> "$GITHUB_STEP_SUMMARY"
